<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween névsorsoló</title><style>body{margin:0;min-height:100vh;background:#241331;color:white;font-family:Arial;text-align:center}main{max-width:700px;margin:auto;padding:20px 12px}h1{color:#ffbd35;font-size:36px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{border:2px solid #ffb52a;border-radius:16px;padding:8px;text-align:left;background:#0004}.team h2{text-align:center;font-size:18px}#result{min-height:110px;display:flex;justify-content:center;align-items:center;font-size:40px;font-weight:bold;color:#fff3c4}#teamname{min-height:28px;font-size:18px}button{width:100%;padding:24px;border:0;border-radius:24px;background:#ff9e24;color:#321400;font-size:28px;font-weight:bold}button:disabled{opacity:.6}</style></head><body><main><div>🦇 🎃 👻 🦇</div><h1>Halloween névsorsoló</h1><p>Ki melyik csapatba kerül? 🕷️</p><div id="result">🎃 <span id="name">Nyomd meg a gombot!</span> 👻</div><div id="teamname"></div><button id="draw">🎃 SORSOLÁS! 🎃</button><div class="teams"><div class="team"><h2>👻 Szellem Csapat</h2><div id="ghost"></div></div><div class="team"><h2>🎃 Tök Csapat</h2><div id="pumpkin"></div></div></div></main><script>const draws=[['Marci','ghost'],['Blanka','pumpkin'],['Lackó','ghost'],['Zalán','pumpkin'],['Zsigi','ghost'],['Szofi','pumpkin'],['Mása','ghost'],['Andris','pumpkin'],['Petike','ghost'],['Laura','pumpkin'],['Zénó','ghost'],['Levi','pumpkin'],['Nándi','ghost'],['Janka','pumpkin'],['Beni','ghost'],['Erik','pumpkin'],['Misi','ghost'],['Kende','pumpkin'],['Grammy','ghost']];let i=0,b=document.getElementById('draw');b.onclick=()=>{if(i>=draws.length)return;b.disabled=true;name.textContent='✨ Sorsolunk... ✨';setTimeout(()=>{let [n,t]=draws[i++];name.textContent=n;teamname.textContent=t==='ghost'?'👻 Szellem Csapat':'🎃 Tök Csapat';document.getElementById(t).innerHTML+='<div>'+(t==='ghost'?'👻 ':'🎃 ')+n+'</div>';if(i===draws.length){b.textContent='🎉 MINDENKI KISORSOLVA! 🎉'}else b.disabled=false},500)}</script></body></html>
